; =====================================================================
;  ESP32 firmware for the ROSFleet robot
;
;  Build + upload:
;      cd firmware/esp32_robot
;      pio run -t upload
;      pio device monitor -b 115200
;
;  The platform version is PINNED on purpose. Arduino-ESP32 3.x changed the
;  LEDC PWM API (ledcSetup/ledcAttachPin became ledcAttach), and silently
;  upgrading would break motor control. 6.5.0 gives Arduino core 2.0.14.
; =====================================================================
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D FIRMWARE_VERSION='"esp32-1.0.0"'
    ; Comment the next line out to build a serial-only firmware
    -D ENABLE_WIFI=1

lib_deps =
