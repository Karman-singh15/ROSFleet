# =====================================================================
#  Shared by BOTH costmaps. The numbers here are scaled for a small
#  20 cm robot - most ROS tutorials use TurtleBot-sized values that make
#  a robot this size refuse to fit through ordinary doorways.
# =====================================================================

# The robot's footprint in base_footprint coordinates, +X forward.
# Slightly larger than the real 0.20 x 0.15 m chassis: the extra centimetre
# absorbs localisation error rather than paint on the walls.
footprint: [[-0.11, -0.09], [-0.11, 0.09], [0.11, 0.09], [0.11, -0.09]]
footprint_padding: 0.01

transform_tolerance: 0.5      # s; generous because Wi-Fi adds TF latency

obstacle_layer:
  enabled: true
  obstacle_range: 2.5         # m; trust the LiDAR out to here for obstacles
  raytrace_range: 3.0         # m; clear free space out to here
  track_unknown_space: true
  combination_method: 1
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: laser_link
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    # Ignore returns from the robot's own body and from the ceiling.
    min_obstacle_height: 0.02
    max_obstacle_height: 0.60
    inf_is_valid: true        # RPLiDAR reports "no return" as inf

inflation_layer:
  enabled: true
  # Keep roughly the robot's half-width away from walls. Too large and a
  # 0.8 m doorway becomes impassable; too small and it clips corners.
  inflation_radius: 0.22
  cost_scaling_factor: 3.0    # lower = wider, softer cost gradient

static_layer:
  enabled: true
  map_topic: /map
  subscribe_to_updates: true
