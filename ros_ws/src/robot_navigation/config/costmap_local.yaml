# The local costmap = a small window that travels with the robot. This is
# what actually keeps it from hitting the chair someone just moved.
local_costmap:
  global_frame: odom          # odom, not map: locally smooth and jump-free
  robot_base_frame: base_footprint

  update_frequency: 5.0       # Hz; must keep up with things that move
  publish_frequency: 2.0
  transform_tolerance: 0.5

  static_map: false
  rolling_window: true
  width: 3.0                  # m
  height: 3.0
  resolution: 0.05

  # Override costmap_common's track_unknown_space, which is right for the
  # global costmap and wrong here. This costmap has no static_layer, so
  # every cell starts as NO_INFORMATION and only the laser can clear it -
  # and the laser can never raytrace the cells under the robot's own
  # footprint. footprintCost() then returns -1 forever, so DWA rejects
  # every trajectory and rotate_recovery refuses to turn:
  #   "Rotate recovery can't rotate in place ... Cost: -1.00"
  # Unknown means "nothing seen there" locally; the walls are the global
  # costmap's job, and GlobalPlanner keeps allow_unknown: false.
  obstacle_layer:
    track_unknown_space: false

  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
