; Runs the VNC server, the noVNC web bridge and roscore together.
; supervisord restarts any of them if they die, which matters because a
; Gazebo crash can take the X server down with it.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:vnc]
command=/usr/bin/vncserver :1 -geometry %(ENV_VNC_RESOLUTION)s -depth 24 -localhost no -fg
autorestart=true
priority=10
stdout_logfile=/var/log/vnc.log
stderr_logfile=/var/log/vnc.err

[program:novnc]
; Serves the VNC session as a web page on 6080.
command=/usr/bin/websockify --web=/usr/share/novnc %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autorestart=true
priority=20
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.err

[program:roscore]
command=/bin/bash -lc "source /opt/ros/noetic/setup.bash && roscore"
autorestart=true
priority=30
stdout_logfile=/var/log/roscore.log
stderr_logfile=/var/log/roscore.err
